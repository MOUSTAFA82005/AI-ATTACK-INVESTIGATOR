<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · TALON INVESTIGATOR</title>
<link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/fx.js" defer></script>
<script src="/static/js/falcon.js" defer></script>
<script src="/static/js/ui.js" defer></script>
<script src="/static/js/app.js" defer></script>
</head>
<body>
<div class="shell" id="shell" hidden>
  <aside class="side glass" id="side">
    <div class="side-top">
      <a class="brand" href="#/home" title="TALON INVESTIGATOR">
        <img class="mark" src="/static/img/mark.svg" width="38" height="38" alt="">
        <span class="lbl brand-name"><b>TALON</b><small>INVESTIGATOR</small></span>
      </a>
      <button class="icon-btn collapse" id="collapse" type="button" aria-label="Collapse the sidebar" aria-pressed="false" title="Collapse the sidebar">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="3" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 3v12" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 7 10.5 9l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <a class="btn btn-primary side-new" href="#/new" title="New investigation">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="lbl">New investigation</span>
    </a>
    <nav class="side-nav" aria-label="Dashboard">
      <div class="side-label"><span class="lbl">Workspace</span></div>
      <a href="#/home" data-route="home" title="Overview">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="9" width="3" height="7" rx="1" fill="currentColor"/><rect x="7.5" y="5" width="3" height="11" rx="1" fill="currentColor"/><rect x="13" y="2" width="3" height="14" rx="1" fill="currentColor"/></svg>
        <span class="lbl">Overview</span></a>
      <a href="#/history" data-route="history" title="Investigations">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2.5" y="2" width="13" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 6.5h7M5.5 9.5h7M5.5 12.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="lbl">Investigations</span><span class="count lbl" id="cnt-inv" hidden></span></a>
      <a href="#/attackers" data-route="attackers" title="Attackers and block list">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="9" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 1v3M9 14v3M1 9h3M14 9h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="lbl">Attackers</span><span class="count lbl threat" id="cnt-att" hidden></span></a>
      <a href="#/notifications" data-route="notifications" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8.5a5 5 0 0 1 10 0c0 4 1.6 5.3 1.6 5.3H3.4S5 12.5 5 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.2 16.4a1.9 1.9 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="lbl">Notifications</span><span class="count lbl threat" id="cnt-notif" hidden></span></a>
      <a href="#/account" data-route="account" title="Account">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="6" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 16c.7-3 3.1-4.6 6-4.6s5.3 1.6 6 4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="lbl">Account</span></a>
    </nav>
    <nav class="side-recent" id="side-recent" aria-label="Recent investigations" hidden></nav>
    <div class="side-foot">
      <div class="server" id="server"><span class="dot"></span><span class="lbl">Checking models…</span></div>
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who-name lbl" id="who-name"></span>
        <button class="icon-btn" id="logout" type="button" title="Log out" aria-label="Log out">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3M11.5 5.5 15 9l-3.5 3.5M15 9H7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu" id="menu" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h1 id="page-title">Overview</h1>
      <div class="side-search top-search" role="search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="side-q" type="search" placeholder="Search logs or IPs" aria-label="Search your logs and visitors" autocomplete="off" spellcheck="false" maxlength="100">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="topbar-actions" id="page-actions"></div>
      <div class="notif">
        <button class="icon-btn bell" id="bell" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8.5a5 5 0 0 1 10 0c0 4 1.6 5.3 1.6 5.3H3.4S5 12.5 5 8.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 16.4a1.9 1.9 0 0 0 3.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="bell-count" id="bell-count" hidden></span>
        </button>
        <div class="notif-panel glass" id="notif-panel" role="dialog" aria-label="Notifications" hidden>
          <div class="notif-head"><strong>Notifications</strong><button class="btn-link" id="notif-read" type="button">Mark all as read</button></div>
          <div class="notif-list" id="notif-list"></div>
          <a class="notif-all" id="notif-all" href="#/notifications">See all notifications</a>
        </div>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
</body>
</html>
