# Isolated lab: OWASP Juice Shop behind Nginx.
# Ports are bound to 127.0.0.1 only, so the lab is reachable from this machine
# and NOT from the network. Never expose this lab publicly.
services:
  juiceshop:
    image: bkimminich/juice-shop
    restart: unless-stopped
    # no "ports": only Nginx can reach it, on the internal Docker network

  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - juiceshop
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx

  dvwa-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lab_fake_root_pw
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: lab_fake_dvwa_pw
    # no "ports": only dvwa reaches this, on the internal Docker network

  dvwa:
    image: vulnerables/web-dvwa
    restart: unless-stopped
    depends_on:
      - dvwa-db
    environment:
      MYSQL_HOSTNAME: dvwa-db
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: lab_fake_dvwa_pw
    # no "ports": only our second Nginx can reach it

  nginx-dvwa:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      - dvwa
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/nginx-dvwa.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
