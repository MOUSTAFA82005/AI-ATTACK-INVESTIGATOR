events {}

http {
    # Standard "combined" format plus ONE extra field at the end: the request
    # body. escape=json keeps quotes/newlines in the body from breaking the
    # line. A combined-log parser still works if it ignores the last field.
    log_format combined_body escape=json
                            '$remote_addr - - [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" "$request_body"';

    access_log /var/log/nginx/access.log combined_body;
    error_log  /var/log/nginx/error.log warn;

    # $request_body is only filled when the whole body is kept in memory.
    client_body_buffer_size      1m;
    client_body_in_single_buffer on;

    server {
        listen 80;

        # Lab only: trust the client IP sent by our traffic generator.
        # Never use this on a real site.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;

        location / {
            proxy_pass http://juiceshop:3000;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}