events {}

http {
    # Same format as the main lab nginx.conf, so both logs parse identically.
    log_format combined_body escape=json
                            '$remote_addr - - [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" "$request_body"';

    access_log /var/log/nginx/dvwa_access.log combined_body;
    error_log  /var/log/nginx/dvwa_error.log warn;

    client_body_buffer_size      1m;
    client_body_in_single_buffer on;

    server {
        listen 80;

        # Lab only: trust the client IP sent by our traffic generator.
        # Never use this on a real site.
        set_real_ip_from 0.0.0.0/0;
        real_ip_header   X-Forwarded-For;

        location / {
            proxy_pass http://dvwa:80;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }
    }
}